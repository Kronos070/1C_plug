<!doctype html>
<html lang="ru" data-theme="{{theme}}" style="{{background}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документация ПерУН</title>
<style>/*{{styles}}*/</style>
</head>
<body>
<div id="docs" class="docs">
  <aside id="side" class="docs-side">
    <div id="side-head" class="side-head"></div>
    <div id="side-search" class="side-search"></div>
    <div id="side-tabs" class="side-tabs" role="tablist"></div>
    <nav id="side-scroll" class="side-scroll">
      <div id="results" class="side-results" hidden></div>
      <div id="tree" class="side-tree" role="tree"></div>
    </nav>
    <div id="side-foot" class="side-foot"></div>
  </aside>
  <div id="resizer" class="docs-resizer" title="Потяните, чтобы изменить ширину"></div>
  <main class="docs-main">
    <div id="bar" class="docs-bar"></div>
    <div id="banner" class="docs-banner" hidden></div>
    <div id="scroll" class="docs-scroll">
      <article id="page" class="docs-page"></article>
    </div>
  </main>
  <div id="toasts" class="toasts"></div>
</div>
<script>/*{{scripts}}*/</script>
</body>
</html>
